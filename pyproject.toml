[project]
name = "ai-commit-generator"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "typer[all]>=0.27.1",
    "uvicorn[standard]>=0.52.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["core/tests"]
